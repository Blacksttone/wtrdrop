# Supabase CLI configuration for Waterdrop (local dev: `supabase start`).
project_id = "waterdrop"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://*.vercel.app"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
file_size_limit = "1MiB"

# Webhooks and schedulers authenticate with signatures / shared secrets, not user JWTs.
[functions.payment-webhook]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = false

[functions.run-scheduled-jobs]
verify_jwt = false

[functions.create-payment-order]
verify_jwt = true
